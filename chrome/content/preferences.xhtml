<linkset xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
         xmlns:html="http://www.w3.org/1999/xhtml">
  <html:link rel="localization" href="researchflow.ftl"/>
</linkset>
<vbox xmlns="http://www.mozilla.org/keymaster/gatekeeper/there.is.only.xul"
      xmlns:html="http://www.w3.org/1999/xhtml"
      id="researchflow-preferences-pane" class="rf-prefs-container"
      onshowing="ResearchFlow_Preferences.init(window)">
  
  <html:div class="rf-pref-brand-header">
    <html:div class="rf-pref-brand-row">
      <html:div class="rf-pref-brand-title" data-l10n-id="researchflow-pref-brand-title">Zotero PaperFlow</html:div>
      <html:div class="rf-pref-brand-tag">v15.0.1</html:div>
    </html:div>
    <html:div class="rf-pref-brand-slogan" data-l10n-id="researchflow-pref-brand-slogan"></html:div>
    <html:div id="rf-pref-status" class="rf-pref-status" role="status" aria-live="polite" data-l10n-id="researchflow-pref-status-ready"></html:div>
  </html:div>

  <!-- Module 1: Window & Workspace Presentation -->
  <html:details class="rf-setting-group" id="rf-acc-window" aria-labelledby="rf-window-title" open="open">
    <html:summary class="rf-setting-group-title" id="rf-window-title" data-l10n-id="researchflow-pref-group-window-title"></html:summary>
    <html:div class="rf-setting-group-body">
      <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-group-window-desc"></html:p>
      
      <html:div id="rf-pref-window" class="rf-pref-content" />

      <html:div class="rf-sub-action-group">
        <html:button id="rf-btn-open-workspace" class="rf-sub-action-btn" type="button">
          <html:span data-l10n-id="researchflow-pref-btn-open-workspace"></html:span>
          <html:span class="rf-sub-chevron">›</html:span>
        </html:button>
        <html:button id="rf-btn-open-subwindow" class="rf-sub-action-btn" type="button">
          <html:span data-l10n-id="researchflow-pref-btn-open-subwindow"></html:span>
          <html:span class="rf-sub-chevron">›</html:span>
        </html:button>
        <html:button id="rf-btn-open-window" class="rf-sub-action-btn" type="button">
          <html:span data-l10n-id="researchflow-pref-btn-open-window"></html:span>
          <html:span class="rf-sub-chevron">›</html:span>
        </html:button>
      </html:div>
    </html:div>
  </html:details>

  <!-- Module 2: Host & Literature Integration -->
  <html:details class="rf-setting-group" id="rf-acc-integration" aria-labelledby="rf-integration-title">
    <html:summary class="rf-setting-group-title" id="rf-integration-title" data-l10n-id="researchflow-pref-group-integration-title"></html:summary>
    <html:div class="rf-setting-group-body">
      <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-group-integration-desc"></html:p>
      
      <html:div id="rf-pref-integration" class="rf-pref-content" />
    </html:div>
  </html:details>

  <!-- Module 3: Manuscripts Kanban & Peer Review Workflow -->
  <html:details class="rf-setting-group" id="rf-acc-workflow" aria-labelledby="rf-workflow-title">
    <html:summary class="rf-setting-group-title" id="rf-workflow-title" data-l10n-id="researchflow-pref-group-workflow-title"></html:summary>
    <html:div class="rf-setting-group-body">
      <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-group-workflow-desc"></html:p>
      
      <html:div id="rf-pref-workflow" class="rf-pref-content" />
    </html:div>
  </html:details>

  <!-- Module 4: Data Storage, Cloud Sync & Resilience -->
  <html:details class="rf-setting-group" id="rf-acc-data" aria-labelledby="rf-data-title">
    <html:summary class="rf-setting-group-title" id="rf-data-title" data-l10n-id="researchflow-pref-group-data-title"></html:summary>
    <html:div class="rf-setting-group-body">
      
      <html:div class="rf-setting-subgroup" id="rf-acc-sync">
        <html:h3 class="rf-setting-subgroup-title" data-l10n-id="researchflow-pref-subgroup-sync-title"></html:h3>
        <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-subgroup-sync-desc"></html:p>
        <html:div class="rf-storage-path-box">
          <html:span class="rf-storage-icon" data-l10n-id="researchflow-pref-storage-path-prefix"></html:span>
          <html:code id="rf-data-path-label" class="rf-storage-code">Zotero/researchflow-data.json</html:code>
        </html:div>
        <html:div id="rf-pref-data-sync" class="rf-pref-content" style="margin-top: 6px;" />
        <html:div class="rf-sub-action-group" style="margin-top: 10px;">
          <html:button id="rf-btn-open-cloud-settings" class="rf-sub-action-btn" type="button">
            <html:span data-l10n-id="researchflow-pref-btn-cloud-settings"></html:span>
            <html:span class="rf-sub-chevron">›</html:span>
          </html:button>
        </html:div>
      </html:div>

      <html:div class="rf-setting-subgroup" id="rf-acc-export">
        <html:h3 class="rf-setting-subgroup-title" data-l10n-id="researchflow-pref-subgroup-export-title"></html:h3>
        <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-subgroup-export-desc"></html:p>
        <html:div class="rf-sub-action-group">
          <html:button id="rf-btn-export-db" class="rf-sub-action-btn" type="button">
            <html:span data-l10n-id="researchflow-pref-btn-export-db"></html:span>
            <html:span class="rf-sub-chevron">›</html:span>
          </html:button>
        </html:div>
      </html:div>

      <html:div class="rf-setting-subgroup" id="rf-acc-import">
        <html:h3 class="rf-setting-subgroup-title" data-l10n-id="researchflow-pref-subgroup-import-title"></html:h3>
        <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-subgroup-import-desc"></html:p>
        <html:div class="rf-control-row" style="margin-bottom: 10px;">
          <html:label for="rf-import-mode" class="rf-control-label" data-l10n-id="researchflow-pref-import-mode-label"></html:label>
          <html:select id="rf-import-mode" class="rf-control" style="max-width: 280px;">
            <html:option value="merge" data-l10n-id="researchflow-pref-import-mode-merge"></html:option>
            <html:option value="overwrite" data-l10n-id="researchflow-pref-import-mode-overwrite"></html:option>
          </html:select>
        </html:div>
        <html:div class="rf-sub-action-group">
          <html:button id="rf-btn-import-file" class="rf-sub-action-btn" type="button">
            <html:span data-l10n-id="researchflow-pref-btn-import-file"></html:span>
            <html:span class="rf-sub-chevron">›</html:span>
          </html:button>
          <html:button id="rf-btn-restore-backup" class="rf-sub-action-btn" type="button">
            <html:span data-l10n-id="researchflow-pref-btn-restore-backup"></html:span>
            <html:span class="rf-sub-chevron">›</html:span>
          </html:button>
          <html:button id="rf-btn-conflict-recovery" class="rf-sub-action-btn" type="button">
            <html:span data-l10n-id="researchflow-recovery-open"></html:span>
            <html:span class="rf-sub-chevron">›</html:span>
          </html:button>
        </html:div>
        <html:p id="rf-import-status" class="rf-import-status-text" role="status" aria-live="polite"></html:p>
      </html:div>

    </html:div>
  </html:details>

  <!-- Module 5: Version Information & Diagnostics -->
  <html:details class="rf-setting-group" id="rf-acc-about" aria-labelledby="rf-about-title">
    <html:summary class="rf-setting-group-title" id="rf-about-title" data-l10n-id="researchflow-pref-group-about-title"></html:summary>
    <html:div class="rf-setting-group-body">
      <html:p class="rf-card-desc" data-l10n-id="researchflow-pref-group-about-desc"></html:p>
      <html:div class="rf-version-info-row"><html:strong data-l10n-id="researchflow-pref-version-label"></html:strong> <span>v15.0.1</span></html:div>
      <html:div class="rf-version-info-row"><html:strong data-l10n-id="researchflow-pref-compat-label"></html:strong> <span data-l10n-id="researchflow-pref-compat-value"></span></html:div>
      <html:div class="rf-version-info-row"><html:strong data-l10n-id="researchflow-pref-release-desc-label"></html:strong> <span data-l10n-id="researchflow-pref-release-desc-value"></span></html:div>
      <html:div class="rf-version-info-row"><html:strong data-l10n-id="researchflow-pref-build-date-label"></html:strong> <span>2026-11-05</span></html:div>
      <html:div class="rf-version-info-row"><html:strong data-l10n-id="researchflow-pref-package-label"></html:strong> <html:a href="https://github.com/groele/Zotero-PaperFlow/releases/download/v15.0.1/zotero-paperflow-15.0.1.xpi" target="_blank" rel="noopener noreferrer">zotero-paperflow-15.0.1.xpi</html:a></html:div>
      <html:div class="rf-version-info-row"><html:strong data-l10n-id="researchflow-pref-repo-label"></html:strong> <html:a href="https://github.com/groele/Zotero-PaperFlow" target="_blank" rel="noopener noreferrer">github.com/groele/Zotero-PaperFlow</html:a></html:div>
      <html:div class="rf-sub-action-group" style="margin-top: 12px;">
        <html:button id="rf-btn-export-diag" class="rf-sub-action-btn" type="button">
          <html:span data-l10n-id="researchflow-pref-btn-export-diag"></html:span>
          <html:span class="rf-sub-chevron">›</html:span>
        </html:button>
      </html:div>
    </html:div>
  </html:details>

</vbox>
